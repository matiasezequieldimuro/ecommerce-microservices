spring.application.name=inventory-service
server.port=${INVENTORY_PORT:5001}
spring.data.mongodb.authentication-database=admin
spring.data.mogodb.username=${INVENTORY_MONGODB_USERNAME:}
spring.data.mogodb.password=${INVENTORY_MONGODB_PASSWORD:}
spring.data.mongodb.uri=${INVENTORY_MONGODB_URI:}
spring.data.mongodb.auto-index-creation=true